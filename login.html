<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Qarena Login</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 40px; }
    .box { background: white; padding: 20px; max-width: 300px; margin: auto; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin-top: 10px; }
    button { width: 100%; padding: 10px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Spiel beitreten</h2>
    <input id="code" placeholder="Einladungscode">
    <input id="name" placeholder="Dein Name">
    <button onclick="join()">Beitreten</button>
  </div>

  <script>
    function join() {
      const code = document.getElementById("code").value.trim();
      const name = document.getElementById("name").value.trim();

      if (!code || !name) {
        alert("Bitte Name und Einladungscode eingeben.");
        return;
      }

      localStorage.setItem("playerName", name);
      localStorage.setItem("sessionCode", code);

      window.location.href = "index.html";
    }
  </script>
</body>
</html>
