<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Deck UI</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="deck-ui.css">

    <!-- Deck UI Logic -->
    <script src="deck-ui.js" defer></script>
</head>

<body>

<div id="deckUI">

    <h2>Dein Deck</h2>

    <!-- GRID MIT ALLEN KARTEN -->
    <div id="cardGrid"></div>

    <!-- DETAIL PANEL -->
    <div id="detailPanel">
        <h3 id="detailName"></h3>

        <img id="detailArtwork" src="" alt="Artwork">

        <div class="stats">
            <div>STR: <span id="valueSTR"></span></div>
            <div>HP: <span id="valueHP"></span></div>
        </div>

        <button id="btnUpgrade">Upgrade</button>
    </div>

    <!-- ACTION BUTTONS -->
    <div id="deckActions">
        <button id="btnSaveDeck">Deck speichern</button>
        <button id="btnBackToLobby">Zurück zur Lobby</button>
    </div>

</div>

</body>
</html>
