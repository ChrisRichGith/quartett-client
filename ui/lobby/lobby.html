<link rel="stylesheet" href="lobby.css">
<script src="lobby.js" defer></script>

<div id="lobbyUI">

    <!-- Spielername + Login -->
    <div id="loginPanel">
        <h2>Spieler Login</h2>
        <input id="playerNameInput" type="text" placeholder="Spielername eingeben">
        <button id="btnLogin">Login</button>
    </div>

    <!-- Lobby Panel -->
    <div id="lobbyPanel" style="display:none;">
        <h2>Lobby</h2>

        <!-- Spielerübersicht -->
        <div id="playerList"></div>

        <!-- Buttons -->
        <div id="lobbyButtons">
            <button id="btnReady" style="display:none;">Bereit</button>
            <button id="btnStartGame" style="display:none;">Spiel starten</button>
        </div>

        <!-- Deck-Management -->
        <div id="deckManagement">
            <button id="btnOpenDeck">Deck öffnen</button>
        </div>
    </div>

</div>
