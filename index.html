<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>Qarena</title>
  <style>
    body { font-family: Arial; background: #eef; padding: 20px; }
    #statusBox { padding: 10px; background: white; border-radius: 6px; }
  </style>
</head>

<body>

  <h1>Qarena</h1>
  <div id="statusBox">Verbinde…</div>

  <div id="layout">

      <!-- LOBBY -->
      <aside id="lobby">
          <h2>Lobby</h2>
          <ul id="lobbyList"></ul>
          <button id="startGameBtn">Spiel starten</button>
      </aside>

      <!-- SPIELFELD -->
      <main id="spielfeld">
          <h2>Spielfeld</h2>

          <div id="playersGrid">
              <div class="playerSlot" id="player1">Spieler 1</div>
              <div class="playerSlot" id="player2">Spieler 2</div>
              <div class="playerSlot" id="player3">Spieler 3</div>
              <div class="playerSlot" id="player4">Spieler 4</div>
          </div>

          <div id="gameStatus"></div>
      </main>

      <!-- CHAT -->
      <aside id="chat">
          <h2>Chat</h2>
          <div id="chatMessages"></div>

          <div id="chatInputBox">
              <input id="chatInput" type="text" placeholder="Nachricht eingeben...">
              <button id="chatSend">Senden</button>
          </div>
      </aside>

  </div>

  <script src="client.js"></script>

</body>
</html>
