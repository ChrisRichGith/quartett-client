<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Qarena</title>
  <style>
    body { font-family: Arial; background: #eef; padding: 20px; }
    #statusBox { padding: 10px; background: white; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>Qarena</h1>
  <div id="statusBox">Verbinde…</div>

<div id="container">

  <!-- Lobby links -->
  <div id="lobby">
    <h2>Lobby</h2>
    <ul id="lobbyList"></ul>
  </div>

  <!-- Spielfeld Mitte -->
  <div id="gameArea">
    <h2>Spielbereich</h2>
    <div id="gameStatus"></div>
  </div>

  <!-- Chat rechts -->
  <div id="chat">
    <h2>Chat</h2>
    <div id="chatMessages"></div>
    <input id="chatInput" type="text" placeholder="Nachricht eingeben...">
    <button id="chatSend">Senden</button>
  </div>

  <button id="startGameBtn">Spiel starten</button>

</div>

<!-- ⭐ Script MUSS ganz unten stehen -->
<script src="client.js"></script>

</body>
</html>
