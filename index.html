<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Qarena</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="layout">

      <!-- HEADER -->
      <header id="header">
          <h1>Qarena</h1>
          <div id="statusBox">Verbinde…</div>
      </header>

      <!-- LOBBY -->
      <aside id="lobby">
          <h2>Lobby</h2>
          <ul id="lobbyList"></ul>
          <button id="startGameBtn">Spiel starten</button>
      </aside>
      
      <!-- SPIELFELD -->
      <main id="spielfeld">
          <h2>Spielfeld</h2>

          <div id="table">
    <div class="seat" id="seat-top">
        <div class="playerName"></div>
        <div class="cardStack"></div>
    </div>

    <div class="seat" id="seat-left">
        <div class="playerName"></div>
        <div class="cardStack"></div>
    </div>

    <div class="seat" id="seat-right">
        <div class="playerName"></div>
        <div class="cardStack"></div>
    </div>

    <div class="seat" id="seat-bottom">
        <div class="playerName"></div>
        <div class="cardStack"></div>
    </div>
</div>



          <div id="gameStatus"></div>
      </main>

      <!-- CHAT -->
      <aside id="chat">
          <h2>Chat</h2>
          <div id="chatMessages"></div>

          <div id="chatInputBox">
              <input id="chatInput" type="text" placeholder="Nachricht eingeben...">
              <button id="chatSend">Senden</button>
          </div>
      </aside>

  </div>

  <script src="client.js"></script>

</body>
</html>
